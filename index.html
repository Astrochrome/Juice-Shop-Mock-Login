<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Juice Shop Mock</title>
  <style>
    body { 
      font-family: 'Roboto', sans-serif; 
      display: grid; 
      place-items: center; 
      min-height: 100vh; 
      background: #1e1e1e; 
      color: #fff; 
      margin: 0;
    }
    .container {
      background: #424242; 
      padding: 2rem; 
      border-radius: 4px; 
      width: 320px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    h2 { margin-top: 0; font-weight: 500; font-size: 24px; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    
    input, select { 
      padding: 0.8rem; 
      border-radius: 4px; 
      border: 1px solid #757575; 
      background: #424242;
      color: white;
    }
    input::placeholder { color: #9e9e9e; }
    
    .btn-primary { 
      background: #546E7A; 
      color: white; 
      cursor: pointer; 
      border: none; 
      padding: 0.8rem;
      border-radius: 4px;
      font-size: 1rem;
    }
    .btn-primary:hover { background: #455A64; }
    
    .link-green { 
      color: #64DD17; 
      text-decoration: none; 
      font-size: 0.85rem; 
      text-align: center;
      cursor: pointer;
    }
    .link-green:hover { text-decoration: underline; }
    
    .hint { font-size: 0.75rem; color: #bdbdbd; font-style: italic; }
    .error { color: #ff5252; font-size: 0.85rem; min-height: 1.2rem; text-align: center; }
    .success { color: #64DD17; font-size: 0.85rem; min-height: 1.2rem; text-align: center; }
    
    #registerView { display: none; }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div class="container" id="loginView">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="loginEmail" placeholder="Email*" required />
      <input type="password" id="loginPassword" placeholder="Password*" required />
      
      <div style="text-align: left;">
        <span class="link-green">Forgot your password?</span>
      </div>

      <button type="submit" class="btn-primary">Log in</button>
      
      <label style="font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <input type="checkbox" style="width: auto;"> Remember me
      </label>

      <div id="loginFeedback" class="error"></div>
      
      <span class="link-green" onclick="toggleView('register')">Not yet a customer?</span>
    </form>
  </div>

  <!-- REGISTRATION VIEW -->
  <div class="container" id="registerView">
    <h2>User Registration</h2>
    <form id="registerForm">
      <input type="text" id="regEmail" placeholder="Email*" required />
      <input type="password" id="regPassword" placeholder="Password*" required />
      <span class="hint">Password must be 8-40 characters long.</span>
      <input type="password" id="regRepeat" placeholder="Repeat Password*" required />

      <div id="regFeedback" class="error"></div>

      <button type="submit" class="btn-primary">Register</button>
      <span class="link-green" onclick="toggleView('login')">Already a customer?</span>
    </form>
  </div>

  <script>
    function toggleView(view) {
      document.getElementById('loginView').style.display = view === 'login' ? 'block' : 'none';
      document.getElementById('registerView').style.display = view === 'register' ? 'block' : 'none';
    }

    function validateAuth(email, password) {
      if (!email.trim() || !password.trim()) return "Fields cannot be empty.";
      if (!email.includes('@')) return "A valid email must contain a '@'.";
      if (password.length < 8) return "Password must be at least 8 characters.";
      return null;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const feedback = document.getElementById('loginFeedback');

      const err = validateAuth(email, password);
      if (err) { feedback.textContent = err; return; }

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        feedback.className = res.ok ? 'success' : 'error';
        // SECURED: Changed innerHTML to textContent to prevent XSS rendering
        feedback.textContent = data.message;
      } catch (err) {
        feedback.textContent = "Server connection error.";
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const repeat = document.getElementById('regRepeat').value;
      const feedback = document.getElementById('regFeedback');

      const err = validateAuth(email, password);
      if (err) { feedback.textContent = err; return; }

      if (password !== repeat) {
        feedback.textContent = "Passwords do not match.";
        return;
      }

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        feedback.className = res.ok ? 'success' : 'error';
        feedback.textContent = data.message;
        if(res.ok) setTimeout(() => toggleView('login'), 2000);
      } catch (err) {
        feedback.textContent = "Server connection error.";
      }
    });
  </script>
</body>
</html>
